name: Publish Firmware

# Builds one firmware and publishes it for over-the-air updates
# (esp32/tools/publish_ota.py): xiao-c6-sensor (the ESP-NOW battery sensors),
# c6 or c3 (the gateways). Afterwards each such device's Firmware entity in
# Home Assistant shows the new version; press Install there.
#
# Needs repository secrets MQTT_HOST, MQTT_USER and MQTT_PASSWORD (the
# gateways' broker settings). Optional repository variables: MQTT_PORT
# (default 1883) and MQTT_BASE_TOPIC (default climate_monitor).
#
# The build uses only defaults from the code: settings such as the ESP-NOW
# key and name must be saved on each device (config page / console `save`;
# gateways save their current settings by themselves on first start). The c3
# build has no `supermini` feature.
#
# (File name kept from when it only built the XIAO firmware.)

on:
  workflow_dispatch:
    inputs:
      firmware:
        description: "Firmware to build"
        required: true
        type: choice
        default: xiao-c6-sensor
        options:
          - xiao-c6-sensor
          - c6
          - c3
      publish:
        description: "Publish to the MQTT broker (off: build and check only)"
        required: false
        type: boolean
        default: true

concurrency:
  group: publish-xiao-firmware
  cancel-in-progress: false

env:
  # Same nightly as the local builds (rustc 2026-04-03); bump deliberately.
  RUSTUP_TOOLCHAIN: nightly-2026-04-04
  ESPFLASH_VERSION: 4.3.0

jobs:
  publish:
    name: Build and publish ${{ inputs.firmware }}
    runs-on: ubuntu-latest
    env:
      FIRMWARE: ${{ inputs.firmware }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src
          rustc -V

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ inputs.firmware }}
          workspaces: |
            esp32/xiao-c6-sensor -> target
            esp32/c6 -> target
            esp32/c3 -> target

      - name: Install espflash
        uses: cargo-bins/cargo-binstall@main

      - run: cargo binstall --no-confirm --locked "espflash@$ESPFLASH_VERSION"

      - name: Build
        run: |
          cd "esp32/$FIRMWARE"
          # No .cargo/config.toml in git: target and build-std given here
          # (the XIAO's example config has them, its [env] lines are comments).
          case "$FIRMWARE" in
            xiao-c6-sensor)
              cp .cargo/config.toml.example .cargo/config.toml
              cargo build --release --locked ;;
            c6)
              cargo build --release --locked --target riscv32imac-unknown-none-elf -Zbuild-std=core,alloc ;;
            c3)
              cargo build --release --locked --target riscv32imc-unknown-none-elf -Zbuild-std=core,alloc ;;
          esac

      - name: Check and publish
        env:
          MQTT_HOST: ${{ secrets.MQTT_HOST }}
          MQTT_USER: ${{ secrets.MQTT_USER }}
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
          MQTT_PORT: ${{ vars.MQTT_PORT || '1883' }}
          MQTT_BASE_TOPIC: ${{ vars.MQTT_BASE_TOPIC || 'climate_monitor' }}
        run: |
          if [ "${{ inputs.publish }}" = "true" ]; then
            if [ -z "$MQTT_HOST" ] || [ -z "$MQTT_PASSWORD" ]; then
              echo "::error::Add the MQTT_HOST, MQTT_USER and MQTT_PASSWORD repository secrets"
              exit 1
            fi
            python3 esp32/tools/publish_ota.py --project "$FIRMWARE" --host "$MQTT_HOST" --port "$MQTT_PORT" \
              --user "$MQTT_USER" --base "$MQTT_BASE_TOPIC" --out "$FIRMWARE.bin"
          else
            python3 esp32/tools/publish_ota.py --project "$FIRMWARE" --dry-run --out "$FIRMWARE.bin"
          fi

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.firmware }}-${{ github.sha }}
          path: ${{ inputs.firmware }}.bin
          if-no-files-found: error

  cleanup:
    name: Keep the last 10 runs
    needs: publish
    # Also after a failed run, so failures do not pile up either.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete older runs of this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 10
        run: |
          # Newest first; the run in progress counts as one of the 10.
          # Deleting a run also deletes its image artifact.
          gh api --paginate "repos/${{ github.repository }}/actions/workflows/publish-xiao-firmware.yml/runs?per_page=100" \
            --jq '.workflow_runs[].id' \
            | tail -n +$((KEEP + 1)) \
            | while read -r id; do
                echo "Deleting run $id"
                gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" || true
              done

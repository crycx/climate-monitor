name: Deploy Frontend On Master

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/climate-monitor/**'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force deploy even if frontend files were not changed"
        required: false
        type: boolean
        default: true

concurrency:
  group: deploy-frontend-master
  cancel-in-progress: true

jobs:
  detect_changes:
    name: Detect Frontend Changes
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.filter.outputs.frontend }}
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/climate-monitor/**'

      - name: Decide whether to deploy
        id: decide
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.force_deploy || 'true' }}" == "true" ]]; then
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_deploy=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_deploy=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
          fi

  build_and_deploy_frontend:
    name: Build And Deploy Frontend
    runs-on: ubuntu-latest
    needs: detect_changes
    if: needs.detect_changes.outputs.should_deploy == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/climate-monitor/package-lock.json

      - name: Install dependencies
        working-directory: frontend/climate-monitor
        run: npm ci

      - name: Build production frontend
        working-directory: frontend/climate-monitor
        run: npm run build

      - name: Upload frontend build to server tmp
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: frontend/climate-monitor/dist/climate-monitor/browser/*
          target: /tmp/climate-frontend-ci
          strip_components: 5
          overwrite: true

      - name: Publish frontend and reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -euo pipefail
            sudo mkdir -p /var/www/climate.sinpal.ee
            sudo find /var/www/climate.sinpal.ee -mindepth 1 -delete
            sudo cp -a /tmp/climate-frontend-ci/. /var/www/climate.sinpal.ee/
            sudo nginx -t
            sudo systemctl reload nginx
            rm -rf /tmp/climate-frontend-ci

  no_frontend_changes:
    name: No Frontend Changes
    runs-on: ubuntu-latest
    needs: detect_changes
    if: needs.detect_changes.outputs.should_deploy != 'true'
    steps:
      - name: Skip message
        run: echo "Frontend did not change and force_deploy was not enabled. Skipping deploy."

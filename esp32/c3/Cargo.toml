[package]
edition      = "2024"
name         = "wroom"
default-run  = "wroom"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "wroom"
path = "./src/bin/main.rs"

[features]
default = ["wifi"]
wifi = [
    "dep:esp-radio",
    "dep:esp-rtos",
    "esp-rtos/embassy",
    "dep:embassy-executor",
    "dep:embassy-net",
    "dep:reqwless",
    "dep:esp-wifi-caddy",
    "dep:wifi-caddy",
    "dep:wifi-caddy-proc",
    "dep:enumset",
    "dep:serde",
    "dep:serde-json-core",
    "dep:der",
]
defmt = []
# Use plain HTTP instead of HTTPS (for local/development testing).
# Combine with wifi: cargo run --release --features wifi,no-tls
no-tls = []

[dependencies]
embedded-dht-rs = { version = "0.5.0", features = ["dht22"] }

# Keep esp-backtrace/esp-println aligned with esp-hal 1.x.
esp-backtrace = { version = "0.18.1", features = [
    "esp32c3",
    "println",
] }

esp-alloc = "0.9.0"
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32c3"] }
esp-hal = { version = "1.0.0", features = ["esp32c3", "unstable"] }
esp-println = { version = "0.16.1", features = ["esp32c3", "log-04"] }
esp-storage = { version = "0.8.1", features = ["esp32c3"] }
esp-radio = { version = "0.17.0", optional = true, features = ["esp32c3", "wifi", "esp-alloc", "unstable", "log-04"] }
esp-rtos  = { version = "0.2.0",  optional = true, features = ["esp32c3", "esp-radio", "esp-alloc"] }
log = { version = "0.4.29" }
critical-section = "1.2.0"

embassy-executor  = { version = "0.9", optional = true, features = ["executor-thread", "nightly"] }
embassy-net       = { version = "0.8", optional = true, features = ["tcp", "dhcpv4", "dns"] }
embassy-time      = { version = "0.4" }
embassy-sync      = "0.7"
embedded-io-async = { version = "0.6", optional = true }
static_cell       = { version = "2" }
reqwless          = { version = "0.14", optional = true, features = ["alloc"] }
esp-wifi-caddy = { version = "0.1.0", optional = true, features = ["nightly", "log"] }
wifi-caddy = { version = "0.1.0", optional = true, features = ["log"] }
wifi-caddy-proc = { version = "0.1.0", optional = true }
enumset = { version = "1.1", default-features = false, optional = true }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"], optional = true }
serde-json-core = { version = "0.6", optional = true }
der = { version = "0.8", features = ["heapless", "derive"], optional = true }


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false

[patch.crates-io]
esp-wifi-caddy = { path = "vendor/esp-wifi-caddy" }
wifi-caddy = { path = "vendor/wifi-caddy" }
wifi-caddy-proc = { path = "vendor/wifi-caddy-proc" }
esp-radio = { path = "vendor/esp-radio" }

[package]
edition      = "2024"
name         = "wroom"
rust-version = "1.88"
version      = "0.1.0"
autobins     = false

[[bin]]
name = "wroom"
path = "./src/bin/main.rs"

[features]
default = ["wifi"]
wifi = []
no-tls = []

[dependencies]
embedded-dht-rs = { version = "0.5.0", features = ["dht22"] }
embedded-hal = "1.0.0"
embedded-graphics = "0.8.1"
ssd1306 = "0.10.0"
display-interface = "0.5.0"
display-interface-i2c = "0.5.0"
heapless = "0.8.0"

# Keep esp-backtrace/esp-println aligned with esp-hal 1.x.
esp-backtrace = { version = "0.18.1", features = [
    "esp32",
    "panic-handler",
    "println",
] }

esp-alloc = "0.9.0"
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32"] }
esp-hal = { version = "1.0.0", features = ["esp32", "unstable"] }
esp-println = { version = "0.16.1", features = ["esp32", "log-04"] }
esp-storage = { version = "0.8.1", features = ["esp32"] }
esp-radio = { version = "0.17.0", features = ["esp32", "wifi", "esp-alloc", "unstable", "log-04"] }
esp-rtos = { version = "0.2.0", features = ["esp32", "esp-radio", "esp-alloc", "embassy"] }
log = { version = "0.4.29" }

embassy-executor = { version = "0.9", features = ["executor-thread"] }
embassy-embedded-hal = { version = "0.5.0", features = ["time"] }
embassy-futures = "0.1.2"
embassy-net = { version = "0.8", features = ["tcp", "udp", "dhcpv4", "dns"] }
embassy-sync = "0.7"
embassy-time = { version = "0.4" }
embedded-io-async = "0.7"
edge-dhcp = "0.7.0"
edge-http = "0.7.0"
edge-captive = "0.7.0"
edge-nal = "0.6.0"
edge-nal-embassy = { version = "0.8.1", default-features = false, features = ["dns", "proto-ipv4", "tcp", "udp"] }
reqwless = { version = "0.14", default-features = false, features = ["alloc"] }
static_cell = { version = "2" }
enumset = { version = "1.1", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
der = { version = "0.8", features = ["heapless", "derive"] }
sequential-storage = { version = "7.0.1", features = ["alloc"] }

critical-section = "1.2.0"


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false

[package]
edition      = "2024"
name         = "wroom"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "wroom"
path = "./src/bin/main.rs"

[dependencies]
embedded-dht-rs = { version = "0.5.0", features = ["dht22"] }

# Keep esp-backtrace/esp-println aligned with esp-hal 1.x.
esp-backtrace = { version = "0.18.1", features = [
    "esp32",
    "panic-handler",
    "println",
] }

esp-alloc = "0.9.0"
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32"] }
esp-hal = { version = "1.0.0", features = ["esp32", "unstable"] }
esp-println = { version = "0.16.1", features = ["esp32", "log-04"] }
esp-radio = { version = "0.17.0", features = ["esp32", "wifi", "esp-alloc", "unstable", "log-04"] }
esp-rtos = { version = "0.2.0", features = ["esp32", "esp-radio", "esp-alloc"] }
log = { version = "0.4.29" }

critical-section = "1.2.0"


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false

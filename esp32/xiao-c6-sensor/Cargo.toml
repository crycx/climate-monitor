[package]
edition      = "2024"
name         = "xiao-c6-sensor"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "xiao-c6-sensor"
path = "./src/main.rs"

[dependencies]
esp-hal = { version = "1.1.0", features = ["esp32c6", "unstable"] }
esp-alloc = "0.10.0"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c6"] }
esp-println = { version = "0.17.0", features = ["esp32c6", "log-04"] }
esp-radio = { version = "0.18.0", features = ["esp32c6", "wifi", "esp-now", "esp-alloc", "unstable", "log-04"] }
esp-rtos = { version = "0.3.0", features = ["esp32c6", "esp-radio", "esp-alloc", "embassy"] }
embassy-executor = { version = "0.10", features = ["executor-thread"] }
embassy-time = "0.5"
embedded-dht-rs = { version = "0.5.0", features = ["dht22"] }
critical-section = "1.2.0"
log = "0.4.29"
nb = "1.1"
embedded-storage = "0.3"
esp-storage = { version = "0.9.0", features = ["esp32c6"] }
static_cell = "2"
# WiFi setup portal (AP + DHCP + HTTP).
embassy-net = { version = "0.8", features = ["tcp", "udp", "proto-ipv4", "medium-ethernet"] }
edge-dhcp = "0.7.0"
edge-nal = "0.6.0"
edge-nal-embassy = { version = "0.8.1", default-features = false, features = ["proto-ipv4", "udp"] }
# ESP-NOW packet authentication (../shared/espnow_packet.rs).
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units    = 1
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false

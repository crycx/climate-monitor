openapi: 3.0.3
info:
  title: Climate Monitor API
  description: IoT API for temperature and humidity monitoring
  version: 1.0.0

servers:
  - url: /api
    description: Same host (via docker compose)

components:
  securitySchemes:
    SessionAuth:
      type: apiKey
      in: cookie
      name: session

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        is_admin:
          type: boolean
        created_at:
          type: string
          format: date-time

    Location:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time

    Device:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        location_id:
          type: integer
        name:
          type: string
        device_type:
          type: string
        api_key:
          type: string
        is_active:
          type: boolean
        last_seen:
          type: string
          format: date-time

    Reading:
      type: object
      properties:
        id:
          type: integer
          format: int64
        device_id:
          type: integer
        sensor_type:
          type: string
        value:
          type: number
          format: float
        unit:
          type: string
        timestamp:
          type: string
          format: date-time

    AuthLogin:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    AuthRegister:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string

    AuthForgotPassword:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    AuthResetPassword:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string

    AuthLoginResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/User'

    AuthChangePassword:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
        new_password:
          type: string

    UserUpdateInput:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        is_admin:
          type: boolean
        password:
          type: string

    UserCreateInput:
      type: object
      required:
        - username
        - email
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        is_admin:
          type: boolean

    UserCreateResponse:
      type: object
      properties:
        message:
          type: string
        email_sent:
          type: boolean
        reset_token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    LocationInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string

    DeviceInput:
      type: object
      required:
        - name
        - location_id
      properties:
        name:
          type: string
        location_id:
          type: integer

    ReadingInput:
      type: object
      required:
        - sensor_type
        - value
        - unit
      properties:
        sensor_type:
          type: string
        value:
          type: number
        unit:
          type: string

paths:
  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegister'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error

  /auth/login:
    post:
      summary: Login user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLogin'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '401':
          description: Invalid credentials

  /auth/logout:
    post:
      summary: Logout user
      tags:
        - Auth
      responses:
        '204':
          description: Logged out

  /auth/forgot-password:
    post:
      summary: Request password reset token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthForgotPassword'
      responses:
        '200':
          description: Reset request accepted

  /auth/reset-password:
    post:
      summary: Reset password with token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthResetPassword'
      responses:
        '200':
          description: Password updated
        '400':
          description: Invalid or expired token

  /auth/me:
    get:
      summary: Get current user
      tags:
        - Auth
      security:
        - SessionAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /auth/change-password:
    post:
      summary: Change current user's password
      tags:
        - Auth
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthChangePassword'
      responses:
        '200':
          description: Password changed
        '400':
          description: Validation error
        '401':
          description: Current password is incorrect

  /users:
    post:
      summary: Create user and send password setup token (admin only)
      tags:
        - Users
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateInput'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreateResponse'
        '400':
          description: Validation error
        '403':
          description: Forbidden
        '409':
          description: Username or email already exists

    get:
      summary: List users (admin gets all, regular user gets self)
      tags:
        - Users
      security:
        - SessionAuth: []
      responses:
        '200':
          description: List of users available to current session
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      summary: Get user by id (self or admin)
      tags:
        - Users
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
        '403':
          description: Forbidden

    patch:
      summary: Update user profile (self or admin)
      tags:
        - Users
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateInput'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error
        '403':
          description: Forbidden
        '404':
          description: User not found
        '409':
          description: Username or email already exists

    delete:
      summary: Delete user account (self or admin)
      tags:
        - Users
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: User deleted
        '403':
          description: Forbidden
        '404':
          description: User not found

  /locations:
    get:
      summary: List user's locations
      tags:
        - Locations
      security:
        - SessionAuth: []
      responses:
        '200':
          description: List of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'

    post:
      summary: Create a location
      tags:
        - Locations
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInput'
      responses:
        '201':
          description: Location created

  /locations/{id}:
    put:
      summary: Update a location
      tags:
        - Locations
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInput'
      responses:
        '200':
          description: Location updated

    delete:
      summary: Delete a location
      tags:
        - Locations
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Location deleted

  /devices:
    get:
      summary: List user's devices
      tags:
        - Devices
      security:
        - SessionAuth: []
      responses:
        '200':
          description: List of devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'

    post:
      summary: Register a new device
      tags:
        - Devices
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceInput'
      responses:
        '201':
          description: Device created

  /devices/{id}:
    get:
      summary: Get device details
      tags:
        - Devices
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Device details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'

    put:
      summary: Update a device
      tags:
        - Devices
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Device updated

    delete:
      summary: Delete a device
      tags:
        - Devices
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Device deleted

  /devices/{id}/readings:
    get:
      summary: Get device readings
      tags:
        - Readings
      security:
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reading'

    post:
      summary: Submit reading (from ESP32)
      tags:
        - Readings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadingInput'
      responses:
        '201':
          description: Reading created

  /readings/latest:
    get:
      summary: Get latest readings across all devices
      tags:
        - Readings
      security:
        - SessionAuth: []
      responses:
        '200':
          description: Latest readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reading'

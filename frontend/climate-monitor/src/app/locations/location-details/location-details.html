<div class="container">
  <div style="max-width: 640px; margin: 0 auto;">
    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-card-title *ngIf="!isCreateMode">Location details</mat-card-title>
        <mat-card-title *ngIf="isCreateMode">Add location</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        <div *ngIf="loading()" style="padding: 8px 0 16px 0;">
          <mat-progress-bar mode="indeterminate"></mat-progress-bar>
        </div>

        <p *ngIf="error()" style="color: #c00; margin-top: 8px;">{{ error() }}</p>
        <p *ngIf="success()" style="color: #0a7f35; margin-top: 8px;">{{ success() }}</p>

        <form [formGroup]="form" autocomplete="off">
          <mat-form-field style="width: 100%;">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name" />
          </mat-form-field>

          <mat-form-field style="width: 100%;">
            <mat-label>Description</mat-label>
            <textarea matInput rows="4" formControlName="description"></textarea>
          </mat-form-field>
        </form>
      </mat-card-content>

      <mat-card-actions>
        <button mat-button type="button" (click)="back()">Back</button>
        <span style="margin-left: auto;"></span>
        <button
          matButton="elevated"
          color="warn"
          type="button"
          class="btn-delete"
          (click)="deleteLocation()"
          [disabled]="isCreateMode || deleting() || loading()"
        >
          Delete
        </button>
        <button
          matButton="elevated"
          color="primary"
          type="button"
          class="btn-ok"
          (click)="save()"
          [disabled]="saving() || loading()"
        >
          {{ isCreateMode ? 'Create' : 'Save' }}
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>

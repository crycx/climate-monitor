<div class="container">
  <h2>Locations</h2>
  <div *ngIf="loading()" style="padding: 12px 0;">
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  </div>

  <div *ngIf="!loading()">
    <div class="flex-between">
      <mat-form-field class="w-50">
        <mat-label>Filter</mat-label>
        <input matInput [formControl]="filterCtrl" placeholder="search (id, name, description)" #input>
      </mat-form-field>
      <button matButton="elevated" color="primary" aria-label="Add location" (click)="openLocation('add')">
        <mat-icon>add</mat-icon>Add
      </button>
    </div>

    <p *ngIf="error()" style="color: #c00; margin-top: 8px;">{{ error() }}</p>

    <div class="mat-elevation-z8 table-card" *ngIf="!error()">
      <div class="table-scroll">
        <table mat-table [dataSource]="dataSource" matSort>
          <ng-container matColumnDef="id" sticky>
            <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
            <td mat-cell *matCellDef="let row">{{ row.id }}</td>
          </ng-container>

          <ng-container matColumnDef="name" sticky>
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
            <td mat-cell *matCellDef="let row">{{ row.name }}</td>
          </ng-container>

          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
            <td mat-cell *matCellDef="let row">{{ row.description || '—' }}</td>
          </ng-container>

          <ng-container matColumnDef="created_at">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Created</th>
            <td mat-cell *matCellDef="let row">{{ row.created_at ? (row.created_at | date:'short') : '—' }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr class="click-row" mat-row *matRowDef="let row; columns: displayedColumns;" (click)="openLocation(row)"></tr>

          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" [attr.colspan]="displayedColumns.length">
              No data matching the filter "{{ input.value }}"
            </td>
          </tr>
        </table>
      </div>
      <mat-paginator [pageSizeOptions]="[10, 25, 100]" aria-label="Select page of locations"></mat-paginator>
    </div>

    <div class="actionButtons">
      <button matButton="elevated" color="primary" aria-label="Add location" (click)="openLocation('add')">
        <mat-icon>add</mat-icon>Add
      </button>
    </div>
  </div>
</div>

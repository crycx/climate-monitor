<div class="container">
  <h2>Users</h2>
  <div *ngIf="loading()" style="padding: 12px 0;">
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  </div>
  <div *ngIf="!loading()">
    <div class="flex-between">
      <mat-form-field class="w-50">
        <mat-label>Filter</mat-label>
        <input matInput [formControl]="filterCtrl" placeholder="search (id, username, email)" #input>
      </mat-form-field>
      <button matButton="elevated" color="primary" aria-label="Add user" (click)="openUser('add')">
        <mat-icon>add</mat-icon>Add
      </button>
    </div>

    <div class="mat-elevation-z8 table-card">
      <div class="table-scroll">
        <table mat-table [dataSource]="dataSource" matSort>

          <!-- ID -->
          <ng-container matColumnDef="id" sticky>
            <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
            <td mat-cell *matCellDef="let row">{{ row.id }}</td>
          </ng-container>

          <!-- Username -->
          <ng-container matColumnDef="username" sticky>
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Username</th>
            <td mat-cell *matCellDef="let row">{{ row.username }}</td>
          </ng-container>

          <!-- Email -->
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
            <td mat-cell *matCellDef="let row">{{ row.email }}</td>
          </ng-container>

          <!-- Admin -->
          <ng-container matColumnDef="is_admin">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Admin</th>
            <td mat-cell *matCellDef="let row">
              <mat-icon *ngIf="row.is_admin" aria-label="Admin">verified</mat-icon>
              <span *ngIf="!row.is_admin">—</span>
            </td>
          </ng-container>

          <!-- Created -->
          <ng-container matColumnDef="created_at">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Created</th>
            <td mat-cell *matCellDef="let row">{{ row.created_at ? (row.created_at | date:'short') : '—' }}</td>
          </ng-container>

          <!-- Company
          <ng-container matColumnDef="company_id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Company</th>
            <td mat-cell *matCellDef="let row">{{ row.company_id ?? '—' }}</td>
          </ng-container> -->
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr class="click-row" mat-row *matRowDef="let row; columns: displayedColumns;" (click)="openUser(row)"></tr>

          <tr class="mat-row" *matNoDataRow >
            <td class="mat-cell" [attr.colspan]="displayedColumns.length">
              No data matching the filter "{{ input.value }}"
            </td>
          </tr>
        </table>
      </div>
      <mat-paginator [pageSizeOptions]="[10, 25, 100]" aria-label="Select page of users"></mat-paginator>
    </div>
    <div class="actionButtons">
      <button matButton="elevated" color="primary" aria-label="Add user" (click)="openUser('add')">
        <mat-icon>add</mat-icon>Add
      </button>
    </div>
  </div>
</div>

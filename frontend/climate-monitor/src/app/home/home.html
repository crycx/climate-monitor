<div class="home-page">
  <div class="home-header">
    <div>
      <h1>Climate Overview</h1>
      <p>Temperature and humidity on one chart.</p>
    </div>
    <div class="header-actions">
      <mat-form-field class="location-filter" appearance="outline" subscriptSizing="dynamic">
        <mat-label>Location</mat-label>
        <mat-select
          panelClass="home-select-panel"
          [value]="selectedLocationId()"
          (selectionChange)="onLocationChange($event.value)"
        >
          <mat-option *ngFor="let option of locationOptions()" [value]="option.id">
            {{ option.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field class="range-filter" appearance="outline" subscriptSizing="dynamic">
        <mat-label>Range</mat-label>
        <mat-select
          panelClass="home-select-panel"
          [value]="selectedRangeHours()"
          (selectionChange)="onRangeChange($event.value)"
        >
          <mat-option *ngFor="let option of rangeOptions" [value]="option.hours">
            {{ option.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-checkbox
        class="auto-refresh-toggle"
        [checked]="autoRefreshEnabled()"
        (change)="onAutoRefreshChange($event.checked)"
      >
        Auto refresh (30s)
      </mat-checkbox>

      <button
        class="refresh-button"
        mat-flat-button
        color="primary"
        type="button"
        (click)="refresh()"
        [disabled]="loading()"
      >
        Refresh
      </button>
    </div>
  </div>

  <p class="status status-error" *ngIf="!loading() && error()">{{ error() }}</p>

  <div class="chart-grid" *ngIf="!error()">
    <section class="chart-card">
      <h2>Temperature + Humidity</h2>
      <div class="chart-shell">
        <canvas #climateCanvas></canvas>
      </div>
    </section>
  </div>

  <p class="updated" *ngIf="lastUpdated()">Last updated: {{ lastUpdated() }}</p>
</div>

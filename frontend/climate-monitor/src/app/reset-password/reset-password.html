<div class="fullAreaCenter">
  <div style="max-width: 420px; margin: 40px auto;">
    <mat-card appearance="outlined">
      <mat-card-header class="mb-2">
        <mat-card-title>Reset password</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        <form id="reset-form" (ngSubmit)="submit()" [formGroup]="form">
          <mat-form-field style="width: 100%;" hidden>
            <mat-label>Reset token</mat-label>
            <input matInput formControlName="token" autocomplete="off" />
          </mat-form-field>

          <mat-form-field style="width: 100%;">
            <mat-label>New password</mat-label>
            <input matInput type="password" formControlName="password" autocomplete="new-password" />
          </mat-form-field>

          <mat-form-field style="width: 100%;">
            <mat-label>Confirm new password</mat-label>
            <input matInput type="password" formControlName="confirmPassword" autocomplete="new-password" />
          </mat-form-field>

          <p *ngIf="error()" style="color: #c00; margin: 8px 0;">{{ error() }}</p>
          <p *ngIf="info()" style="color: #2e7d32; margin: 8px 0;">{{ info() }}</p>
        </form>
      </mat-card-content>

      <mat-card-actions>
        <button style="margin-right: auto;" mat-button type="button" routerLink="/login">Back to login</button>
        <button style="margin-left: auto;" matButton color="primary" type="submit" form="reset-form" [disabled]="loading">
          {{ loading ? 'Saving...' : 'Save new password' }}
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>

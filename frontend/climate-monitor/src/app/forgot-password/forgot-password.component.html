<div class="fullAreaCenter">
  <div style="max-width: 420px; margin: 40px auto;">
    <mat-card appearance="outlined">
      <mat-card-header class="mb-2">
        <mat-card-title>Forgot password</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        <form id="forgot-form" (ngSubmit)="submit()" [formGroup]="form">
          <mat-form-field style="width: 100%;">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" autocomplete="email" />
          </mat-form-field>

          <p *ngIf="error()" style="color: #c00; margin: 8px 0;">{{ error() }}</p>
          <p *ngIf="info()" style="color: #2e7d32; margin: 8px 0;">{{ info() }}</p>

          <div *ngIf="devToken()" style="margin-top: 12px;">
            <p style="font-size: 12px; color: #666;">Dev reset token:</p>
            <code style="word-break: break-all; display: block; margin-bottom: 8px;">{{ devToken() }}</code>
            <button mat-stroked-button type="button" color="primary" (click)="openResetPage()">Open reset page with token</button>
          </div>
        </form>
      </mat-card-content>

      <mat-card-actions>
        <button style="margin-right: auto;" mat-button type="button" routerLink="/login">Back to login</button>
        <button style="margin-left: auto;" matButton color="primary" type="submit" form="forgot-form" [disabled]="loading">
          {{ loading ? 'Sending...' : 'Send reset instructions' }}
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>

<div class="fullAreaCenterWithHeader">
  <div style="max-width: 420px; width: 100%; margin: 40px auto;">
    <mat-card appearance="outlined">
      <mat-card-header class="mb-2">
        <mat-card-title>Change password</mat-card-title>
      </mat-card-header>

      <mat-card-content>
        <form id="change-password-form" [formGroup]="form" (ngSubmit)="submit()">
          <mat-form-field style="width: 100%;">
            <mat-label>Current password</mat-label>
            <input matInput [type]="showCurrentPassword() ? 'text' : 'password'" formControlName="currentPassword" autocomplete="current-password" name="currentpassword" />
            <button mat-icon-button matSuffix type="button" (click)="toggleCurrentPasswordVisibility()" [attr.aria-label]="showCurrentPassword() ? 'Hide password' : 'Show password'">
              <mat-icon>{{ showCurrentPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </mat-form-field>

          <mat-form-field style="width: 100%;">
            <mat-label>New password</mat-label>
            <input matInput [type]="showNewPassword() ? 'text' : 'password'" formControlName="newPassword" autocomplete="new-password" name="newpassword1" />
            <button mat-icon-button matSuffix type="button" (click)="toggleNewPasswordVisibility()" [attr.aria-label]="showNewPassword() ? 'Hide password' : 'Show password'">
              <mat-icon>{{ showNewPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </mat-form-field>

          <mat-form-field style="width: 100%;">
            <mat-label>Confirm new password</mat-label>
            <input matInput [type]="showConfirmPassword() ? 'text' : 'password'" formControlName="confirmPassword" autocomplete="new-password" name="newpassword2" />
            <button mat-icon-button matSuffix type="button" (click)="toggleConfirmPasswordVisibility()" [attr.aria-label]="showConfirmPassword() ? 'Hide password' : 'Show password'">
              <mat-icon>{{ showConfirmPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </mat-form-field>

          <p *ngIf="error()" style="color: #c00; margin: 8px 0;">{{ error() }}</p>
        </form>
      </mat-card-content>

      <mat-card-actions>
        <button mat-button type="button" (click)="back()">Back</button>
        <button style="margin-left: auto;" matButton color="primary" type="submit" form="change-password-form" [disabled]="loading()">
          Change password
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
